[package]
name = "pos-app"
version = "0.1.0"
description = "POS de escritorio (kiosco)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": permite abrir el inspector de la webview (clic derecho -> Inspeccionar, con teclado F12 en
# WebView2 o Ctrl+Shift+I en WebKitGTK) para poder leer la pestaña Red/Network directamente en la pantalla
# del POS, sin depender de SSH ni de un navegador aparte. Sin esta feature, Tauri deshabilita el inspector en
# builds release. No hay riesgo extra: el inspector solo lo abre quien tiene acceso físico al equipo, que ya
# podría leer la red con otras herramientas del sistema.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Binario más pequeño y rápido — importante en el hardware modesto del kiosco.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

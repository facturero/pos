[package]
name = "pos-app"
version = "0.1.0"
description = "POS de escritorio (kiosco)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Binario más pequeño y rápido — importante en el hardware modesto del kiosco.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

#cloud-config
# autoinstall.yaml de Ubuntu Server 24.04 LTS para el equipo Facturero.
# Se coloca en la raíz de la ISO remasterizada (os/iso/REMOSTRADO.md) y el
# kernel arranca con `autoinstall ds=nocloud;s=/cdrom/`.
# Los placeholders __...__ los sustituye build-iso.sh (o el dueño) según los
# parámetros de os/iso/iso-params.example.
autoinstall:
  version: 1
  locale: es_ES.UTF-8
  keyboard:
    layout: es
  source:
    id: ubuntu-server-minimal
  identity:
    hostname: __HOSTNAME__
    username: taller
    # Contrasena BLOQUEADA ("!"): nadie puede entrar con clave escrita. subiquity exige el campo
    # y "password: null" da "Malformed autoinstall in identity section". El acceso tecnico es
    # SOLO por SSH con clave (ssh.authorized-keys), desde la red de administracion.
    password: "!"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - __SSH_PUB_KEY__
  storage:
    layout:
      name: lvm
  # Cada evento de la instalacion se avisa a un servidor LOCAL que lanza start-screen.sh (install-tui.py): asi la
  # pantalla muestra pasos a la izquierda y los comandos en vivo a la derecha. El texto de subiquity sigue en la
  # consola 1 (Alt+F1 si algo falla). Si el servidor no esta, el aviso simplemente se pierde.
  reporting:
    facturero:
      type: webhook
      endpoint: http://127.0.0.1:8765/events
  # Pantalla de instalacion: primero la marca simple (brand.sh) y encima la pantalla dividida (install-tui.py).
  # Es cosmetica: nunca debe impedir instalar (|| true).
  early-commands:
    - sh /cdrom/pos-os/iso/start-screen.sh || true
  late-commands:
    # el registro de eventos crudos se guarda en el equipo instalado (sirve para ajustar la pantalla)
    - cp /run/facturero-install-events.log /target/var/log/facturero-installer-events.log || true
    # sistema instalado: sin menu de grub ni mensajes al arrancar (la pantalla la cubre brand.sh en el
    # primer arranque y el kiosco despues)
    - mkdir -p /target/etc/default/grub.d
    - |
      cat > /target/etc/default/grub.d/99-facturero.cfg <<'EOF'
      GRUB_TIMEOUT=0
      GRUB_TIMEOUT_STYLE=hidden
      GRUB_RECORDFAIL_TIMEOUT=0
      GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=0 systemd.show_status=false vt.global_cursor_default=0"
      EOF
    - curtin in-target --target=/target -- update-grub
    # cloud-init escribe sus mensajes en la consola activa (la pantalla de marca): a un archivo, no a pantalla
    - mkdir -p /target/etc/cloud/cloud.cfg.d
    - |
      cat > /target/etc/cloud/cloud.cfg.d/99-facturero-quiet.cfg <<'EOF'
      output:
        all: ">> /var/log/cloud-init-output.log"
      EOF
    # 0) el técnico entra solo por SSH con clave (contraseña bloqueada), así que sudo no puede pedir
    #    contraseña: sin esto no podría administrar el equipo. Está limitado por la red de admin (ufw).
    - echo "taller ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/90-taller
    - chmod 440 /target/etc/sudoers.d/90-taller
    # Se ejecutan en el entorno vivo, con la raíz instalada en /target
    # 1) los scripts del OS viajan en la ISO bajo /cdrom/pos-os
    - mkdir -p /target/opt/facturero
    - cp -ra /cdrom/pos-os /target/opt/facturero/os-src
    # 2) parámetros de la instalación (se consumen en el primer arranque)
    - mkdir -p /target/etc/facturero
    - cp /cdrom/iso-params.env /target/etc/facturero/install-params.env
    # 3) unidad de primer arranque que corre install.sh + setup-kiosk.sh
    - cp /cdrom/pos-os/iso/facturero-firstboot.service /target/etc/systemd/system/facturero-firstboot.service
    - mkdir -p /target/etc/systemd/system/multi-user.target.wants
    - ln -s /etc/systemd/system/facturero-firstboot.service /target/etc/systemd/system/multi-user.target.wants/facturero-firstboot.service
#cloud-config
# autoinstall.yaml de Ubuntu Server 24.04 LTS para el equipo Facturero.
# Se coloca en la raíz de la ISO remasterizada (os/iso/REMOSTRADO.md) y el
# kernel arranca con `autoinstall ds=nocloud;s=/cdrom/`.
# Los placeholders __...__ los sustituye build-iso.sh (o el dueño) según los
# parámetros de os/iso/iso-params.example.
autoinstall:
  version: 1
  locale: es_ES.UTF-8
  keyboard:
    layout: es
  source:
    id: ubuntu-server-minimal
  identity:
    hostname: __HOSTNAME__
    username: taller
    # Contrasena BLOQUEADA ("!"): nadie puede entrar con clave escrita. subiquity exige el campo
    # y "password: null" da "Malformed autoinstall in identity section". El acceso tecnico es
    # SOLO por SSH con clave (ssh.authorized-keys), desde la red de administracion.
    password: "!"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - __SSH_PUB_KEY__
  storage:
    layout:
      name: lvm
  late-commands:
    # 0) el técnico entra solo por SSH con clave (contraseña bloqueada), así que sudo no puede pedir
    #    contraseña: sin esto no podría administrar el equipo. Está limitado por la red de admin (ufw).
    - echo "taller ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/90-taller
    - chmod 440 /target/etc/sudoers.d/90-taller
    # Se ejecutan en el entorno vivo, con la raíz instalada en /target
    # 1) los scripts del OS viajan en la ISO bajo /cdrom/pos-os
    - mkdir -p /target/opt/facturero
    - cp -ra /cdrom/pos-os /target/opt/facturero/os-src
    # 2) parámetros de la instalación (se consumen en el primer arranque)
    - mkdir -p /target/etc/facturero
    - cp /cdrom/iso-params.env /target/etc/facturero/install-params.env
    # 3) unidad de primer arranque que corre install.sh + setup-kiosk.sh
    - cp /cdrom/pos-os/iso/facturero-firstboot.service /target/etc/systemd/system/facturero-firstboot.service
    - mkdir -p /target/etc/systemd/system/multi-user.target.wants
    - ln -s /etc/systemd/system/facturero-firstboot.service /target/etc/systemd/system/multi-user.target.wants/facturero-firstboot.service